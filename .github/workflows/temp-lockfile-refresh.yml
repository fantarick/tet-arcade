# One-time lockfile regeneration after adding React component test dependencies.
name: Refresh npm lockfile (temporary)

on:
  push:
    branches:
      - feat/m1-playable-react-app

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'fantarick/tet-arcade'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile without install scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update lockfile for React component tests"
          git push origin HEAD:feat/m1-playable-react-app
