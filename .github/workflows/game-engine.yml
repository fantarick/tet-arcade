name: Game engine checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  game-engine:
    name: Run deterministic Pulse Grid tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dependency-free game tests
        run: node --experimental-strip-types --test tests/game/pulse-grid.test.mjs
